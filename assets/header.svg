<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
  <defs>
    <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E6EDF3" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="72%" cy="50%" r="55%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0F6FC"/>
      <stop offset="0.55" stop-color="#E6EDF3"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0F14" stop-opacity="1"/>
      <stop offset="1" stop-color="#0A0F14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }

    .base  { stroke: #2DD4BF; stroke-opacity: 0.16; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .trace { stroke: #2DD4BF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 46 420; animation: flow 3.6s linear infinite; }
    .t2 { animation-delay: -0.7s; } .t3 { animation-delay: -1.5s; } .t4 { animation-delay: -2.2s; }
    .t5 { animation-delay: -2.9s; } .t6 { animation-delay: -1.1s; } .t7 { animation-delay: -2.5s; }
    @keyframes flow { from { stroke-dashoffset: 466; } to { stroke-dashoffset: 0; } }

    .chip  { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { stroke-opacity: 0.55; } 50% { stroke-opacity: 1; } }

    .pulse { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3); opacity: 0; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .in  { opacity: 0; animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
    .i1 { animation-delay: 0.05s; } .i2 { animation-delay: 0.2s; } .i3 { animation-delay: 0.35s; } .i4 { animation-delay: 0.5s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0A0F14"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- circuit traces flowing into the chip -->
    <g>
      <path class="base" d="M1200 60 H1040 L970 130 H890"/>
      <path class="base" d="M1200 110 H1070 L1030 150 H890"/>
      <path class="base" d="M1200 170 H890"/>
      <path class="base" d="M1200 230 H1070 L1030 190 H890"/>
      <path class="base" d="M1200 280 H1040 L970 210 H890"/>
      <path class="base" d="M835 0 V110"/>
      <path class="base" d="M835 340 V230"/>

      <path class="trace"    d="M1200 60 H1040 L970 130 H890"/>
      <path class="trace t2" d="M1200 110 H1070 L1030 150 H890"/>
      <path class="trace t3" d="M1200 170 H890"/>
      <path class="trace t4" d="M1200 230 H1070 L1030 190 H890"/>
      <path class="trace t5" d="M1200 280 H1040 L970 210 H890"/>
      <path class="trace t6" d="M835 0 V110"/>
      <path class="trace t7" d="M835 340 V230"/>

      <g fill="#0A0F14" stroke="#2DD4BF" stroke-width="1.5">
        <circle cx="1040" cy="60"  r="3.5"/>
        <circle cx="1070" cy="110" r="3.5"/>
        <circle cx="1070" cy="230" r="3.5"/>
        <circle cx="1040" cy="280" r="3.5"/>
      </g>
    </g>

    <!-- chip -->
    <g>
      <rect x="780" y="110" width="110" height="120" rx="16" fill="#0D1419" stroke="#2DD4BF" stroke-width="1.5" class="chip"/>
      <rect x="792" y="122" width="86" height="96" rx="10" stroke="#2DD4BF" stroke-opacity="0.18"/>
      <text x="835" y="179" text-anchor="middle" class="mono" font-size="26" font-weight="700" fill="#2DD4BF" letter-spacing="1">AR</text>
      <text x="835" y="203" text-anchor="middle" class="mono" font-size="10" fill="#2DD4BF" fill-opacity="0.55" letter-spacing="2">DEV.01</text>
      <g fill="#2DD4BF" fill-opacity="0.5">
        <rect x="770" y="140" width="10" height="2" rx="1"/>
        <rect x="770" y="160" width="10" height="2" rx="1"/>
        <rect x="770" y="180" width="10" height="2" rx="1"/>
        <rect x="770" y="200" width="10" height="2" rx="1"/>
      </g>
    </g>

    <!-- soften the left so text stays readable -->
    <rect width="700" height="340" fill="url(#fadeLeft)" opacity="0.6"/>

    <!-- text -->
    <g class="in i1">
      <text x="72" y="96" class="mono" font-size="16" fill="#2DD4BF">$ whoami</text>
    </g>
    <g class="in i2">
      <text x="68" y="172" class="sans" font-size="76" font-weight="700" letter-spacing="-2.5" fill="url(#name)">Ali Rayyan</text>
    </g>
    <g class="in i3">
      <text x="72" y="214" class="sans" font-size="22" fill="#9BA7B4">Web developer crafting clean, fast interfaces.</text>
    </g>
    <g class="in i4">
      <rect x="72" y="250" width="196" height="34" rx="17" fill="#2DD4BF" fill-opacity="0.08" stroke="#2DD4BF" stroke-opacity="0.35"/>
      <circle cx="92" cy="267" r="4" fill="#2DD4BF" class="pulse"/>
      <circle cx="92" cy="267" r="4" fill="#2DD4BF"/>
      <text x="106" y="272" class="mono" font-size="14" fill="#2DD4BF">open to new work</text>
      <text x="292" y="272" class="mono" font-size="14" fill="#7D8590">› building things for the web</text>
      <rect x="546" y="257" width="9" height="18" fill="#2DD4BF" class="cursor"/>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="19.5" stroke="#E6EDF3" stroke-opacity="0.08" stroke-width="1.5"/>
  </g>
</svg>
